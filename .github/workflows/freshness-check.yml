# Daily health alarm for Content Radar. Read-only and free — it never scrapes and
# never deletes. Two checks, both failing loudly (GitHub failure email + optional
# Resend email to ALERT_EMAIL):
#   · check-freshness.js — is the newest posted_at older than FRESHNESS_MAX_DAYS?
#   · check-storage.js   — is the image bucket near Supabase's storage cap?
# The second exists because going over that cap restricts the whole project API,
# not just storage, and only a billing action can undo it.
name: freshness-check

on:
  schedule:
    - cron: '30 7 * * *' # daily 07:30 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: instagram-pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: neil@highelmstudio.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node check-freshness.js
      # Runs even when the freshness check fails, because the two alarms answer
      # different questions and a stale-data failure is exactly when a storage
      # problem is most likely to be the cause underneath it.
      - if: always()
        run: node check-storage.js
