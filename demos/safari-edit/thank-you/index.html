<!-- Consent Mode v2 — identical defaults to the landing page. MUST run before
     Google Tag Manager loads. The visitor's earlier choice is restored further
     down, from the shared .thesafariedit.com cookie. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    functionality_storage: 'denied',
    personalization_storage: 'denied',
    security_storage: 'granted',
    wait_for_update: 500
  });

  // Restore the choice made on the landing page, before GTM loads, so a
  // consenting visitor's Lead event is not held back by the default deny.
  (function () {
    var m = document.cookie.match(/(?:^|;\s*)tse_consent=([^;]+)/);
    var prior = m ? decodeURIComponent(m[1]) : null;
    if (prior !== 'granted' && prior !== 'denied') return;
    var granted = prior === 'granted';
    gtag('consent', 'update', {
      ad_storage: granted ? 'granted' : 'denied',
      ad_user_data: granted ? 'granted' : 'denied',
      ad_personalization: granted ? 'granted' : 'denied',
      analytics_storage: granted ? 'granted' : 'denied',
      functionality_storage: granted ? 'granted' : 'denied',
      personalization_storage: granted ? 'granted' : 'denied'
    });
    dataLayer.push({ event: granted ? 'consent_granted' : 'consent_denied' });
  })();

  // The conversion. Only fires when THIS visit submitted the form — the flag is
  // set by the landing page and cleared here, so a refresh or a revisit never
  // counts a second Lead. Build the GTM Lead trigger on this event.
  (function () {
    var submitted;
    try { submitted = sessionStorage.getItem('tse_enquiry') === '1'; } catch (e) { submitted = false; }
    if (!submitted) return;
    try { sessionStorage.removeItem('tse_enquiry'); } catch (e) {}
    dataLayer.push({ event: 'enquiry_submitted' });
  })();
</script>

j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MKT3D9G5');</script>
